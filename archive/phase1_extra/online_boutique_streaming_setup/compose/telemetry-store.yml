services:
  redis:
    image: redis:7.2-alpine
    container_name: ob-streaming-redis
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: pgvector/pgvector:pg16
    container_name: ob-streaming-postgres
    environment:
      POSTGRES_DB: ob_streaming
      POSTGRES_USER: ob_streaming
      POSTGRES_PASSWORD: ob_streaming
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ob_streaming -d ob_streaming"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis-data:
  postgres-data:
