# pipeline_run_id: pipeline_sens_test_v1
# reference_run_id: rca_sens_test_c3rolling_v1
# M9-B sensitivity line (V36 (a), QD-039) -- OUTSIDE the registration, never used for the H5 verdict:
# the same frozen RCA method on the alerts of the `c3_rolling_baseline` ablation of ctav_final_test.yaml
# (438 alerts: 47 TP, 391 FP). Only split / h5_test / input / run_id differ from rca_final.yaml; the run
# must print method fingerprint b0c54fa68ef65535. Run once.
kind: rca
run_id: rca_sens_test_c3rolling_v1
split: test
h5_test: true  # M9-B
input:
  ctav_config: eval/configs/ctav_final_test.yaml
  variant: c3_rolling_baseline  # 438 alerts (47 TP, 391 FP), QD-038
  evidence_run: h0_test_c1_k0_v1  # retrieval.jsonl holding the text of the cited evidence
grouping:
  t_group_seconds: 180
propagation:
  level: 1  # backward 1-hop, pure algorithm; level 2 was cut (QD-037)
  sign: alert  # only CTAV-confirmed services count as abnormal
  sign_pad_seconds: 60
labels:
  window_seconds: 60  # QD-003
  cascade_min_services: 2  # a cascade fault = its alerts touch at least 2 services
summarizer:
  enabled: true
  backend: gemini
  model: gemini-2.5-flash  # the judge model (QD-021); temperature 0, thinking budget 0
  max_output_tokens: 1024
  max_calls_per_minute: 60
  require_evidence: true
  max_evidence: 12
  excerpt_chars: 240
  prompt_version: rca-summary-v1  # services/rca_agent/summarizer.py
  prompt_fingerprint: 8c1d50e6ba757ee6  # the run stops if the prompt in code differs
  budget_usd: 1.0  # M9 budget (CURRENT-MILESTONE.md); worst-case estimate must stay below
  stop_usd: 2.0  # M9 stop threshold
postgres:
  write: true  # run_registry, incidents, diagnostic_reports, diagnostic_rejected (03 SS4)
n_boot: 1000
seed: 42
