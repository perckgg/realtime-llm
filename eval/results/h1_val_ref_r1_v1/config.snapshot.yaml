detector:
  buffer_size: 2
  fit:
    split: dev
    strategy: split
  threshold: 0.85
  type: isolation_forest
evidence:
  store: nezha
h1:
  far_min_s: 180
  near_s: 60
  sample: eval/samples/h1_val_v1.json.gz
  seed: 42
judge:
  backend: api
  confidence_threshold: 0.8
  drop_metrics:
  - PodSuccessRate(%)
  max_calls_per_minute: 200
  model: gemini-2.5-flash
  require_evidence: true
  temperature: 0
  workers: 8
retrieval:
  max_tokens: 4000
  params:
    alpha: 0.35
    beta: 0.25
    bm25_k: 60
    bm25_pool: window
    engine: vectorized
    gamma: 0.4
    graph_max_distance: 2
    graph_per_service_limit: 20
    k_graph: 0
    tau_seconds: 300
    time_margin_minutes: 8
  timeout_ms: 500
  top_k: 6
  type: hybrid_bm25_graph
  workers: 6
seed: 42
split: val
time_source: wall
