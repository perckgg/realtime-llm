# M8 / G-test, config đăng ký #4 (H4): như h0_test_bm25, ngân sách 120 lần gọi theo thứ tự thời gian. 100% cache.
# Sao từ h0_val_bm25_b120.yaml; chỉ đổi run_id, split, g_test.
run_id: h0_test_bm25_b120_v1
seed: 42
split: test
g_test: true  # M8: giả thuyết đã đăng ký (commit be2b985)
time_source: wall

detector:
  type: isolation_forest
  threshold: 0.85
  buffer_size: 2
  fit:
    strategy: split
    split: dev

evidence:
  store: nezha
gate:
  enabled: false
  max_llm_calls: 120
  budget_exhausted_action: manual_review
retrieval:
  type: bm25_hybrid
  top_k: 6
  max_tokens: 4000
  timeout_ms: 500
  workers: 6
  params: {}
judge:
  backend: api
  model: gemini-2.5-flash
  temperature: 0
  require_evidence: true
  confidence_threshold: 0.80
  max_calls_per_minute: 200
  workers: 8
  drop_metrics: ["PodSuccessRate(%)"]
