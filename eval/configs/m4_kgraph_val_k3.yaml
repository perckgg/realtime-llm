# QĐ-024 (V18): chọn k_graph trên val — C1 window, engine vectorized, k_graph=3, judge mock (không gọi API).
# Tiêu chí: scripts/kgraph_select.py (tỷ lệ fault window có telemetry mà top-6 chứa bằng chứng service gốc).
run_id: m4_kgraph_val_k3_v1
seed: 42
split: val
time_source: wall

detector:
  type: isolation_forest
  threshold: 0.85
  buffer_size: 2
  fit:
    strategy: split
    split: dev

evidence:
  store: nezha

retrieval:
  type: hybrid_bm25_graph
  top_k: 6
  max_tokens: 4000
  timeout_ms: 500
  workers: 6
  params:
    bm25_pool: window
    alpha: 0.35
    beta: 0.25
    gamma: 0.40
    tau_seconds: 300
    bm25_k: 60
    graph_max_distance: 2
    graph_per_service_limit: 20
    time_margin_minutes: 8
    engine: vectorized
    k_graph: 3

judge:
  backend: mock

