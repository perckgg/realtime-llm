# M8 (QĐ-035, phân tích mô tả độ lệch detector val → test): điểm anomaly của cùng detector trên `dev`
# (chính tập fit — làm mốc tham chiếu). Đúng cấu hình của val_detector_count / m8_test_detector_count;
# chỉ đổi run_id và split. Không retrieval, không judge, 0 USD.
run_id: m8_test_shift_dev_detector_v1
seed: 42
split: dev
time_source: wall
stages: detector

detector:
  type: isolation_forest
  threshold: 0.85
  buffer_size: 2
  contamination: 0.05
  n_estimators: 100
  random_state: 42
  fit:
    strategy: split
    split: dev
