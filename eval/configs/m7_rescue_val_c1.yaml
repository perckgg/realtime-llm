# M7 / QĐ-033 bước 2: chấm một lần các cửa sổ Rescue (hợp của 147 tổ hợp, m7_rescue_plan_val_v1)
# trên đúng tầng của CTAV chốt: retrieval C1-paper + judge như h0_val_c1_k0 (cùng prompt, model,
# temperature). Chỉ các cửa sổ trong danh sách được chấm (source=rescue); candidate metric đã có cache
# ở h0_val_c1_k0_v1. Ước tính 1.459 lần gọi ≈ 0,84 USD theo token (≈ 0,96 USD × 1,14); ngưỡng dừng M7 6 USD.
run_id: m7_rescue_val_c1_v1
seed: 42
split: val
time_source: wall

detector:
  type: isolation_forest
  threshold: 0.85
  buffer_size: 2
  fit:
    strategy: split
    split: dev

rescue:
  windows: eval/results/m7_rescue_plan_val_v1/rescue_windows.csv

evidence:
  store: nezha
retrieval:
  type: hybrid_bm25_graph
  top_k: 6
  max_tokens: 4000
  timeout_ms: 500
  workers: 6
  params:
    bm25_pool: window
    alpha: 0.35
    beta: 0.25
    gamma: 0.40
    tau_seconds: 300
    bm25_k: 60
    graph_max_distance: 2
    graph_per_service_limit: 20
    time_margin_minutes: 8
    engine: vectorized
    k_graph: 0
judge:
  backend: api
  model: gemini-2.5-flash
  temperature: 0
  require_evidence: true
  confidence_threshold: 0.80
  max_calls_per_minute: 200
  workers: 8
  drop_metrics: ["PodSuccessRate(%)"]
