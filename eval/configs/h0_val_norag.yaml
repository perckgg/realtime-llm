# QĐ-026 (H0): LLM-không-RAG (retrieval none), require_evidence=false — số chính của baseline này (người dùng chốt).
# Prompt trùng prompt của candidate có retrieval rỗng ở BM25/C1 ⇒ dùng chung cache.
run_id: h0_val_norag_v1
seed: 42
split: val
time_source: wall

detector:
  type: isolation_forest
  threshold: 0.85
  buffer_size: 2
  fit:
    strategy: split
    split: dev

evidence:
  store: nezha
retrieval:
  type: none
  top_k: 6
  max_tokens: 4000
  timeout_ms: 500
  params: {}
judge:
  backend: api
  model: gemini-2.5-flash
  temperature: 0
  require_evidence: false
  confidence_threshold: 0.80
  max_calls_per_minute: 200
  workers: 8
  drop_metrics: ["PodSuccessRate(%)"]
