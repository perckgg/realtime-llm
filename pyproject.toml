[project]
name = "aiops-rca-platform"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",       # Isolation Forest
    "rank-bm25>=0.2.2",        # BM25
    "networkx>=3.2",           # service dependency graph
    "clickhouse-connect>=0.7",
    "psycopg[binary]>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "structlog>=24.1",
    "tenacity>=8.2",           # retry with a hard limit
    "pyarrow>=15.0",           # parquet for rescue features
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "mypy>=1.9",
    "ruff>=0.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# Deliberately excluded: LangChain/AutoGen, vector DB clients (Chroma/Qdrant/pgvector),
# Kafka client libs. See docs/Final_Thesis_Phase2/06-scope-guard.md §4.
# Phase 1 code under legacy/ keeps its own dependency list in legacy/requirements.txt.
