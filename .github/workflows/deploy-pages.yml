name: Deploy Web Demo to GitHub Pages

on:
  push:
    branches:
      - demo/gh-pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: services/web/package-lock.json

      - name: Install dependencies
        working-directory: services/web
        run: npm ci

      - name: Typecheck and smoke test
        working-directory: services/web
        run: npm run check

      - name: Build static bundle for GitHub Pages
        working-directory: services/web
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_DATA_SOURCE: static
        run: npm run build

      - name: Verify static API snapshot present
        run: test -f services/web/dist/static-api/runs.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: services/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
