experiment:
  name: nezha_hybrid_monitoring
  mode: hybrid

data:
  metric_path: nezha_setup/processed/metrics.csv
  log_path: nezha_setup/processed/logs.jsonl

preprocessing:
  window_size: 120
  stride: 60
  normalization: zscore

detector:
  name: feature_pressure
  contamination: 0.05
  threshold: 0.70

retrieval:
  vector_db: local
  embedding_model: hashing
  top_k: 8
  time_margin_minutes: 8

llm_gate:
  enabled: true
  low_threshold: 0.65
  high_threshold: 0.95
  high_score_action: call_llm
  max_llm_calls_per_minute: 20
  max_total_calls: 1000

llm:
  provider: mock
  model: mock-judge
  temperature: 0
  max_output_tokens: 512

decision:
  confidence_threshold: 0.80

evaluation:
  output_dir: nezha_setup/outputs/results
  audit_dir: nezha_setup/outputs/audit
  max_llm_calls: 1000
