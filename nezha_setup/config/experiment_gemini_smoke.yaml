experiment:
  name: nezha_gemini_smoke
  mode: hybrid

data:
  metric_path: nezha_setup/processed/metrics.csv
  log_path: nezha_setup/processed/logs.jsonl

preprocessing:
  window_size: 120
  stride: 60
  normalization: zscore

detector:
  name: feature_pressure
  contamination: 0.05
  threshold: 0.70

retrieval:
  vector_db: local
  embedding_model: hashing
  top_k: 5
  time_margin_minutes: 8

llm_gate:
  enabled: true
  low_threshold: 0.65
  high_threshold: 0.95
  high_score_action: call_llm
  max_llm_calls_per_minute: 5
  max_total_calls: 5

llm:
  provider: gemini
  model: gemini-2.5-flash
  temperature: 0
  max_output_tokens: 2048

decision:
  confidence_threshold: 0.80

evaluation:
  output_dir: nezha_setup/outputs/gemini_smoke/results
  audit_dir: nezha_setup/outputs/gemini_smoke/audit
  max_windows: 50
  max_llm_calls: 5
