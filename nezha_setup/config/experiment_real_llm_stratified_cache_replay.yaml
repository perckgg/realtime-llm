experiment:
  name: nezha_real_llm_stratified_cache_replay
  mode: hybrid

data:
  metric_path: nezha_setup/processed/metrics.csv
  log_path: nezha_setup/processed/logs.jsonl

preprocessing:
  window_size: 120
  stride: 60
  normalization: zscore

detector:
  name: isolation_forest
  contamination: 0.05
  threshold: 0.95
  n_estimators: 100
  random_state: 42
  fit_strategy: warmup
  warmup_windows: 1000
  train_on_normal_only: false
  min_fit_windows: 20

candidate_rescue:
  enabled: true
  min_detector_score: 0.0
  min_context_score: 0.70
  min_trace_duration_ms: 1.0
  promoted_score: 0.85

retrieval:
  vector_db: hybrid_bm25
  embedding_model: hashing_bm25
  embedding_dimensions: 512
  top_k: 6
  search_k: 500
  time_margin_minutes: 8
  semantic_weight: 0.35
  time_weight: 0.25
  metadata_weight: 0.25
  signal_weight: 0.15

llm_gate:
  enabled: true
  low_threshold: 0.80
  high_threshold: 0.98
  high_score_action: call_llm
  max_llm_calls_per_minute: 0
  max_total_calls: 120

llm:
  provider: gemini
  model: gemini-2.5-flash-lite
  temperature: 0
  max_output_tokens: 1024
  timeout_seconds: 60
  input_cost_per_1m_tokens: 0.10
  output_cost_per_1m_tokens: 0.40
  cost_pricing_source: gemini_flash_lite_published_cache_replay

decision:
  confidence_threshold: 0.80
  llm_budget_exhausted_action: manual_review

evaluation:
  output_dir: nezha_setup/outputs/real_llm_stratified/results
  audit_dir: nezha_setup/outputs/real_llm_stratified/audit
  max_windows: 0
  max_llm_calls: 120
