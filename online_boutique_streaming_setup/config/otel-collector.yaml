mode: deployment

image:
  repository: otel/opentelemetry-collector-contrib

service:
  enabled: true

ports:
  otlp:
    enabled: true
    containerPort: 4317
    servicePort: 4317
    protocol: TCP
  otlp-http:
    enabled: true
    containerPort: 4318
    servicePort: 4318
    protocol: TCP

presets:
  kubernetesAttributes:
    enabled: true
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  clusterMetrics:
    enabled: true

config:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
    k8s_cluster:
      collection_interval: 15s

  processors:
    batch:
      timeout: 5s
    k8sattributes:
      auth_type: serviceAccount

  exporters:
    debug:
      verbosity: basic
    otlphttp/bridge:
      endpoint: http://telemetry-bridge.online-boutique.svc.cluster.local:4318

  service:
    pipelines:
      metrics:
        receivers: [otlp, k8s_cluster]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/bridge, debug]
      logs:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/bridge, debug]
      traces:
        receivers: [otlp]
        processors: [k8sattributes, batch]
        exporters: [otlphttp/bridge, debug]
