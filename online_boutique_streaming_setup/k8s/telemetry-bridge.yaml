apiVersion: v1
kind: ServiceAccount
metadata:
  name: telemetry-bridge
  namespace: online-boutique
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: telemetry-bridge
  namespace: online-boutique
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: telemetry-bridge
  namespace: online-boutique
subjects:
  - kind: ServiceAccount
    name: telemetry-bridge
    namespace: online-boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: telemetry-bridge
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: telemetry-bridge-script
  namespace: online-boutique
data:
  bridge.py: |
    from __future__ import annotations

    import base64
    import hashlib
    import json
    import os
    import ssl
    import threading
    import time
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from typing import Any

    import psycopg
    import redis

    NAMESPACE = os.getenv("TARGET_NAMESPACE", "online-boutique")
    POLL_INTERVAL_SECONDS = float(os.getenv("POLL_INTERVAL_SECONDS", "15"))
    SERVICE_PORT = int(os.getenv("SERVICE_PORT", "4318"))

    REDIS_HOST = os.getenv("REDIS_HOST", "telemetry-store-host")
    REDIS_PORT = int(os.getenv("REDIS_PORT", "6379"))
    REDIS_MAXLEN = int(os.getenv("REDIS_MAXLEN", "500000"))
    STREAM_METRICS = os.getenv("STREAM_METRICS", "ob:metrics")
    STREAM_LOGS = os.getenv("STREAM_LOGS", "ob:logs")
    STREAM_TRACES = os.getenv("STREAM_TRACES", "ob:traces")

    PG_DSN = (
        f"host={os.getenv('POSTGRES_HOST', 'telemetry-store-host')} "
        f"port={os.getenv('POSTGRES_PORT', '5432')} "
        f"dbname={os.getenv('POSTGRES_DB', 'ob_streaming')} "
        f"user={os.getenv('POSTGRES_USER', 'ob_streaming')} "
        f"password={os.getenv('POSTGRES_PASSWORD', 'ob_streaming')}"
    )

    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    API_SERVER = "https://kubernetes.default.svc"

    redis_client = redis.Redis(host=REDIS_HOST, port=REDIS_PORT, decode_responses=True)
    pg_conn: psycopg.Connection[Any] | None = None
    seen_events: set[str] = set()
    pod_service_by_name: dict[str, str] = {}

    def utc_now() -> str:
        return datetime.now(timezone.utc).isoformat()

    def json_dumps(value: Any) -> str:
        return json.dumps(value, separators=(",", ":"), sort_keys=True)

    def get_pg() -> psycopg.Connection[Any]:
        global pg_conn
        if pg_conn is None or pg_conn.closed:
            pg_conn = psycopg.connect(PG_DSN, autocommit=True)
        return pg_conn

    def pg_execute(sql: str, params: tuple[Any, ...]) -> None:
        conn = get_pg()
        with conn.cursor() as cur:
            cur.execute(sql, params)

    def xadd(stream: str, payload: dict[str, Any]) -> None:
        clean = {key: "" if value is None else str(value) for key, value in payload.items()}
        redis_client.xadd(stream, clean, maxlen=REDIS_MAXLEN, approximate=True)

    def current_fault_for(service_id: str) -> str | None:
        try:
            conn = get_pg()
            with conn.cursor() as cur:
                cur.execute(
                    """
                    SELECT fault_id
                    FROM fault_events
                    WHERE status = 'running'
                      AND (service_id = %s OR service_id = 'all')
                    ORDER BY started_at DESC NULLS LAST
                    LIMIT 1
                    """,
                    (service_id,),
                )
                row = cur.fetchone()
                return str(row[0]) if row else None
        except Exception as exc:
            print(f"[bridge] current_fault lookup failed: {exc}", flush=True)
            return None

    def k8s_get(path: str) -> dict[str, Any]:
        with open(TOKEN_PATH, encoding="utf-8") as fh:
            token = fh.read().strip()
        req = urllib.request.Request(
            f"{API_SERVER}{path}",
            headers={"Authorization": f"Bearer {token}"},
        )
        context = ssl.create_default_context(cafile=CA_PATH)
        with urllib.request.urlopen(req, context=context, timeout=20) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def write_metric(
        *,
        event_time: str,
        service_id: str,
        pod_id: str,
        node_id: str,
        metric_name: str,
        metric_value: float,
        source: str,
        labels: dict[str, Any],
        raw: dict[str, Any],
    ) -> None:
        ingest_time = utc_now()
        fault_id = current_fault_for(service_id)
        payload = {
            "event_time": event_time,
            "ingest_time": ingest_time,
            "service_id": service_id,
            "pod_id": pod_id,
            "node_id": node_id,
            "metric_name": metric_name,
            "metric_value": metric_value,
            "source": source,
            "fault_id": fault_id or "",
            "labels": json_dumps(labels),
        }
        xadd(STREAM_METRICS, payload)
        pg_execute(
            """
            INSERT INTO metric_samples
                (event_time, ingest_time, service_id, pod_id, node_id, metric_name,
                 metric_value, source, fault_id, labels, raw)
            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s::jsonb, %s::jsonb)
            """,
            (
                event_time,
                ingest_time,
                service_id,
                pod_id,
                node_id,
                metric_name,
                metric_value,
                source,
                fault_id,
                json_dumps(labels),
                json_dumps(raw),
            ),
        )

    def write_log(
        *,
        event_time: str,
        service_id: str,
        pod_id: str,
        node_id: str,
        severity: str,
        event_type: str,
        message: str,
        source: str,
        metadata: dict[str, Any],
    ) -> None:
        ingest_time = utc_now()
        fault_id = current_fault_for(service_id)
        doc_hash = hashlib.sha1(f"{event_time}|{service_id}|{pod_id}|{message}".encode("utf-8")).hexdigest()[:16]
        doc_id = f"{source}-{doc_hash}"
        payload = {
            "event_time": event_time,
            "ingest_time": ingest_time,
            "service_id": service_id,
            "pod_id": pod_id,
            "node_id": node_id,
            "severity": severity,
            "event_type": event_type,
            "message": message,
            "source": source,
            "fault_id": fault_id or "",
            "doc_id": doc_id,
            "metadata": json_dumps(metadata),
        }
        xadd(STREAM_LOGS, payload)
        pg_execute(
            """
            INSERT INTO log_events
                (event_time, ingest_time, service_id, pod_id, node_id, severity,
                 event_type, message, source, fault_id, metadata)
            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s::jsonb)
            """,
            (
                event_time,
                ingest_time,
                service_id,
                pod_id,
                node_id,
                severity,
                event_type,
                message,
                source,
                fault_id,
                json_dumps(metadata),
            ),
        )
        pg_execute(
            """
            INSERT INTO context_documents
                (doc_id, event_time, ingest_time, service_id, pod_id, node_id,
                 source, event_type, severity, message, fault_id, metadata)
            VALUES (%s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s, %s::jsonb)
            ON CONFLICT (doc_id) DO NOTHING
            """,
            (
                doc_id,
                event_time,
                ingest_time,
                service_id,
                pod_id,
                node_id,
                source,
                event_type,
                severity,
                message,
                fault_id,
                json_dumps(metadata),
            ),
        )

    def write_otlp_payload(path: str, content_type: str, body: bytes) -> None:
        event_time = utc_now()
        ingest_time = utc_now()
        endpoint = path.strip("/") or "otlp"
        if "trace" in endpoint:
            stream = STREAM_TRACES
            source = "otlp_trace"
        elif "log" in endpoint:
            stream = STREAM_LOGS
            source = "otlp_log"
        else:
            stream = STREAM_METRICS
            source = "otlp_metric"
        body_hash = hashlib.sha1(body).hexdigest()
        metadata = {
            "endpoint": endpoint,
            "content_type": content_type,
            "payload_bytes": len(body),
            "payload_sha1": body_hash,
            "payload_prefix_b64": base64.b64encode(body[:128]).decode("ascii"),
        }
        payload = {
            "event_time": event_time,
            "ingest_time": ingest_time,
            "service_id": "otel-collector",
            "pod_id": "",
            "node_id": "",
            "source": source,
            "fault_id": "",
            "metadata": json_dumps(metadata),
        }
        xadd(stream, payload)
        if stream == STREAM_METRICS:
            write_metric(
                event_time=event_time,
                service_id="otel-collector",
                pod_id="",
                node_id="",
                metric_name="otlp_payload_bytes",
                metric_value=float(len(body)),
                source=source,
                labels={"endpoint": endpoint},
                raw=metadata,
            )
        elif stream == STREAM_TRACES:
            pg_execute(
                """
                INSERT INTO trace_spans
                    (event_time, ingest_time, trace_id, span_id, service_id,
                     operation_name, source, metadata)
                VALUES (%s, %s, %s, %s, %s, %s, %s, %s::jsonb)
                """,
                (
                    event_time,
                    ingest_time,
                    body_hash,
                    body_hash[:16],
                    "otel-collector",
                    endpoint,
                    source,
                    json_dumps(metadata),
                ),
            )
        else:
            write_log(
                event_time=event_time,
                service_id="otel-collector",
                pod_id="",
                node_id="",
                severity="INFO",
                event_type="otlp_payload",
                message=f"OTLP payload received on {endpoint}, bytes={len(body)}",
                source=source,
                metadata=metadata,
            )

    def poll_kubernetes() -> None:
        while True:
            try:
                poll_pods()
                poll_events()
            except Exception as exc:
                print(f"[bridge] poll failed: {exc}", flush=True)
            time.sleep(POLL_INTERVAL_SECONDS)

    def poll_pods() -> None:
        data = k8s_get(f"/api/v1/namespaces/{NAMESPACE}/pods")
        event_time = utc_now()
        for item in data.get("items", []):
            meta = item.get("metadata", {})
            spec = item.get("spec", {})
            status = item.get("status", {})
            labels = meta.get("labels", {})
            pod_id = meta.get("name", "")
            service_id = labels.get("app") or labels.get("app.kubernetes.io/name") or pod_id.split("-")[0]
            pod_service_by_name[pod_id] = service_id
            node_id = spec.get("nodeName", "")
            phase = status.get("phase", "Unknown")
            raw_base = {"phase": phase, "labels": labels}
            write_metric(
                event_time=event_time,
                service_id=service_id,
                pod_id=pod_id,
                node_id=node_id,
                metric_name="pod_phase_running",
                metric_value=1.0 if phase == "Running" else 0.0,
                source="kubernetes_pod_status",
                labels=labels,
                raw=raw_base,
            )
            for container in status.get("containerStatuses", []) or []:
                cname = container.get("name", "")
                clabels = {**labels, "container": cname}
                write_metric(
                    event_time=event_time,
                    service_id=service_id,
                    pod_id=pod_id,
                    node_id=node_id,
                    metric_name="container_ready",
                    metric_value=1.0 if container.get("ready") else 0.0,
                    source="kubernetes_pod_status",
                    labels=clabels,
                    raw=container,
                )
                write_metric(
                    event_time=event_time,
                    service_id=service_id,
                    pod_id=pod_id,
                    node_id=node_id,
                    metric_name="container_restart_count",
                    metric_value=float(container.get("restartCount", 0) or 0),
                    source="kubernetes_pod_status",
                    labels=clabels,
                    raw=container,
                )

    def poll_events() -> None:
        data = k8s_get(f"/api/v1/namespaces/{NAMESPACE}/events")
        for item in data.get("items", []):
            meta = item.get("metadata", {})
            involved = item.get("involvedObject", {})
            event_uid = meta.get("uid", "")
            count = str(item.get("count", 1))
            last_time = item.get("lastTimestamp") or item.get("eventTime") or item.get("firstTimestamp") or utc_now()
            key = f"{event_uid}:{count}:{last_time}"
            if key in seen_events:
                continue
            seen_events.add(key)
            pod_id = involved.get("name", "")
            service_id = pod_service_by_name.get(pod_id) or pod_id.split("-")[0] or "unknown"
            severity = "ERROR" if item.get("type") == "Warning" else "INFO"
            write_log(
                event_time=last_time,
                service_id=service_id,
                pod_id=pod_id,
                node_id="",
                severity=severity,
                event_type=item.get("reason", "kubernetes_event"),
                message=item.get("message", ""),
                source="kubernetes_event",
                metadata=item,
            )

    class Handler(BaseHTTPRequestHandler):
        def do_POST(self) -> None:
            length = int(self.headers.get("Content-Length", "0") or "0")
            body = self.rfile.read(length)
            try:
                write_otlp_payload(self.path, self.headers.get("Content-Type", ""), body)
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
            except Exception as exc:
                print(f"[bridge] otlp write failed: {exc}", flush=True)
                self.send_response(500)
                self.end_headers()
                self.wfile.write(str(exc).encode("utf-8"))

        def log_message(self, format: str, *args: Any) -> None:
            print(f"[bridge-http] {format % args}", flush=True)

    def main() -> None:
        redis_client.ping()
        get_pg()
        threading.Thread(target=poll_kubernetes, daemon=True).start()
        server = ThreadingHTTPServer(("0.0.0.0", SERVICE_PORT), Handler)
        print(f"[bridge] listening on 0.0.0.0:{SERVICE_PORT}", flush=True)
        server.serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: Service
metadata:
  name: telemetry-bridge
  namespace: online-boutique
spec:
  selector:
    app: telemetry-bridge
  ports:
    - name: otlp-http
      port: 4318
      targetPort: 4318
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-bridge
  namespace: online-boutique
  labels:
    app: telemetry-bridge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-bridge
  template:
    metadata:
      labels:
        app: telemetry-bridge
    spec:
      serviceAccountName: telemetry-bridge
      containers:
        - name: bridge
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - python -m pip install --no-cache-dir redis 'psycopg[binary]' && python /app/bridge.py
          env:
            - name: TARGET_NAMESPACE
              value: online-boutique
            - name: POLL_INTERVAL_SECONDS
              value: "15"
            - name: SERVICE_PORT
              value: "4318"
            - name: REDIS_HOST
              value: telemetry-store-host
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_MAXLEN
              value: "500000"
            - name: STREAM_METRICS
              value: ob:metrics
            - name: STREAM_LOGS
              value: ob:logs
            - name: STREAM_TRACES
              value: ob:traces
            - name: POSTGRES_HOST
              value: telemetry-store-host
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_DB
              value: ob_streaming
            - name: POSTGRES_USER
              value: ob_streaming
            - name: POSTGRES_PASSWORD
              value: ob_streaming
          ports:
            - name: otlp-http
              containerPort: 4318
          volumeMounts:
            - name: bridge-script
              mountPath: /app
          readinessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 4318
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: bridge-script
          configMap:
            name: telemetry-bridge-script
