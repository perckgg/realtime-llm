apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: online-boutique
resources:
  - https://raw.githubusercontent.com/GoogleCloudPlatform/microservices-demo/v0.10.5/release/kubernetes-manifests.yaml
patches:
  - target:
      kind: Service
      name: frontend-external
    patch: |-
      - op: replace
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30080
  - target:
      kind: Deployment
      name: loadgenerator
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "20"
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "2"
