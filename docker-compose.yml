# Phase 2 skeleton. clickhouse/postgres are runnable now; everything else is commented out
# until the service code that would build/serve it exists (see docs/Final_Thesis_Phase2/07-setup-guide.md §6).
services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    profiles: ["dev", "full"]
    ports:
      - "8123:8123"
      # Host 9000 is permanently held by Zscaler (ZSATunnel.exe) on this
      # machine -- remapped to 9004. Only the HTTP interface (8123) is used
      # by packages/storage/clickhouse.py (clickhouse_connect); this native
      # TCP port is for clickhouse-client and isn't required by the pipeline.
      - "9004:9000"
    environment:
      CLICKHOUSE_DB: aiops
      CLICKHOUSE_PASSWORD: aiops
    volumes:
      # Named volume, not a ./volumes bind mount: ClickHouse's atomic-rename
      # insert path fails with "Permission denied" on a Windows/WSL2-shared
      # bind mount (unlike postgres below, which tolerates it fine).
      - clickhouse-data:/var/lib/clickhouse
      - ./infra/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      retries: 5

  postgres:
    image: postgres:16-alpine
    profiles: ["dev", "full"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: aiops
      POSTGRES_PASSWORD: aiops
      POSTGRES_DB: aiops
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aiops"]
      interval: 10s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/Dockerfile.api
    profiles: ["dev", "full"]
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      CLICKHOUSE_HOST: clickhouse
      POSTGRES_HOST: postgres
      RESULTS_DIR: /app/eval/results
      NEZHA_DATA_DIR: /app/data/Nezha
      SPLITS_DIR: /app/data/splits
    volumes:
      - ./eval:/app/eval:ro
      - ./data:/app/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      clickhouse: { condition: service_healthy }
      postgres:   { condition: service_healthy }

